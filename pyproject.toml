[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "huawei-netops-mcp"
version = "1.0.4"
description = "Cross-platform network automation MCP with RBAC, dual approval, templates and safe batch orchestration"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastmcp>=2.3,<3",
  "netmiko>=4.5,<5",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6,<7",
  "cryptography>=44,<46",
  "filelock>=3.16,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.9,<1"]

[project.scripts]
netops-mcp = "app.main:main"
netops = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
